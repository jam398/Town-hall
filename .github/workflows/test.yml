# Town Hall - CI/CD Pipeline
# 
# Runs on every push and pull request to main/Beginning branches
# Tests: Lint, Unit, E2E, Accessibility, Visual, Performance

name: Tests

on:
  push:
    branches: [main, Beginning, master]
  pull_request:
    branches: [main, Beginning, master]

jobs:
  # Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./townhall-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './townhall-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run Stylelint (CSS)
        run: npm run lint:css

      - name: Run Markdownlint
        run: npm run lint:md

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage --coverageThreshold='{"global":{"branches":80,"functions":80,"lines":80,"statements":80}}'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Run integration tests
        run: npx playwright test tests/integration

      - name: Run Lighthouse tests
        run: npm run test:lighthouse

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            townhall-frontend/playwright-report/
            townhall-frontend/test-results/
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: townhall-frontend/coverage/
          retention-days: 30

  # Build verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: frontend-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './townhall-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./townhall-frontend

      - name: Build application
        run: npm run build
        working-directory: ./townhall-frontend

      - name: Check bundle size
        run: |
          echo "Checking bundle size..."
          du -sh .next/static/chunks/*.js | head -20
          TOTAL_SIZE=$(du -s .next/static | cut -f1)
          echo "Total static size: ${TOTAL_SIZE}KB"
          if [ "$TOTAL_SIZE" -gt 5000 ]; then
            echo "::error::Bundle size exceeds 5MB threshold (${TOTAL_SIZE}KB)"
            exit 1
          fi
          echo "Bundle size OK: ${TOTAL_SIZE}KB"
        working-directory: ./townhall-frontend

  # Deploy to Vercel (automatic via Vercel GitHub integration)
  # Note: Vercel handles deployments automatically when connected to GitHub.
  # This job is kept for manual/backup deployments if needed.
  # 
  # Required secrets for manual deployment:
  # - VERCEL_TOKEN: Your Vercel personal access token
  # - VERCEL_ORG_ID: Your Vercel organization ID
  # - VERCEL_PROJECT_ID: Your Vercel project ID
  # - NEXT_PUBLIC_API_URL: Backend API URL (Render)
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build, backend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check Vercel secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::notice::Vercel secrets not configured. Using Vercel's automatic GitHub integration instead."
            echo "::notice::To enable manual deployments, add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets."
            exit 0
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './townhall-frontend/package-lock.json'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./townhall-frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./townhall-frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./townhall-frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Backend Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./townhall-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './townhall-backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build backend
        run: npm run build

  # Docker build verification
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, backend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./townhall-frontend
          push: false
          tags: townhall-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build test Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./townhall-frontend
          file: ./townhall-frontend/Dockerfile.test
          push: false
          tags: townhall-frontend:test-runner
          cache-from: type=gha
          cache-to: type=gha,mode=max
