# Town Hall - Docker Compose Configuration
# 
# Usage:
#   docker-compose up        # Start all services
#   docker-compose up -d     # Start in background
#   docker-compose down      # Stop all services
#   docker-compose logs -f   # Follow logs

version: '3.8'

services:
  # Frontend - Next.js Application
  frontend:
    build:
      context: ./townhall-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:3001/api
    depends_on:
      - backend
    networks:
      - townhall-network
    restart: unless-stopped

  # Backend - API Server
  backend:
    build:
      context: ./townhall-backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Sanity CMS
      - SANITY_PROJECT_ID=${SANITY_PROJECT_ID}
      - SANITY_DATASET=${SANITY_DATASET:-production}
      - SANITY_API_VERSION=${SANITY_API_VERSION:-2024-01-01}
      - SANITY_TOKEN=${SANITY_TOKEN}
      # Email Service
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-hello@townhallnewark.org}
      # HubSpot CRM
      - HUBSPOT_API_KEY=${HUBSPOT_API_KEY}
      - HUBSPOT_PORTAL_ID=${HUBSPOT_PORTAL_ID:-}
      # OpenAI (Optional - Phase 3)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      # Discord Webhooks (Optional - Phase 2.2)
      - DISCORD_WEBHOOK_EVENTS=${DISCORD_WEBHOOK_EVENTS:-}
      - DISCORD_WEBHOOK_VOLUNTEERS=${DISCORD_WEBHOOK_VOLUNTEERS:-}
      - DISCORD_WEBHOOK_GENERAL=${DISCORD_WEBHOOK_GENERAL:-}
      # Rate Limiting
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
    networks:
      - townhall-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # n8n - Workflow Automation Platform
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: townhall-n8n
    ports:
      - "5678:5678"
    environment:
      # Basic Configuration
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      
      # Security - Change these in production!
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme123}
      
      # Encryption key for credentials (generate with: openssl rand -hex 32)
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-generate-a-secure-key-here}
      
      # Timezone
      - GENERIC_TIMEZONE=${TZ:-America/New_York}
      - TZ=${TZ:-America/New_York}
      
      # Execution Data
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168  # Keep execution data for 7 days
      
      # Performance
      - N8N_PAYLOAD_SIZE_MAX=16  # Max payload size in MB
      
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - townhall-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  townhall-network:
    driver: bridge

# Volumes for persistent data
volumes:
  n8n_data:
    driver: local
